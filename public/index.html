<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daryaft | Coming soon</title>
<meta name="description" content="Some things are waiting to be found. Daryaft is coming soon to Pakistan.">
<meta name="theme-color" content="#03401B">
<meta property="og:title" content="Daryaft | Coming soon">
<meta property="og:description" content="Some things are waiting to be found.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='600 330 420 340'%3E%3Crect x='560' y='300' width='500' height='400' fill='%2303401B'/%3E%3Cpath d='M625 654V481A135 135 0 0 1 895 481V654Z' fill='%23F4F1E4'/%3E%3Cpath d='M717 654V535A139 139 0 0 1 995 535V654Z' fill='%2303401B'/%3E%3Cpath d='M737 654V535A119 119 0 0 1 975 535V654Z' fill='%23F4BF4B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;500&family=Young+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #03401B;
    --green-deep: #022B12;
    --cream: #F4F1E4;
    --gold: #F4BF4B;
    --muted: #BCC6B1;
    --line: #2F6A45;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; background: var(--green); }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--green);
    color: var(--cream);
    font-family: "Figtree", "Segoe UI", system-ui, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 28px clamp(20px, 5vw, 72px) 28px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* header */
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 44px; height: auto; display: block; }
  .brand span {
    font-family: "Young Serif", Georgia, serif;
    font-size: 1.35rem;
    letter-spacing: 0.01em;
  }

  /* main */
  main {
    display: grid;
    gap: clamp(32px, 6vw, 72px);
    align-items: center;
    padding: clamp(28px, 6vw, 56px) 0;
  }
  @media (min-width: 880px) {
    main { grid-template-columns: 1.05fr 0.95fr; }
  }
  h1 {
    font-family: "Young Serif", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.5rem, 6.4vw, 4.6rem);
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin: 0 0 20px;
    max-width: 12ch;
  }
  .lede {
    margin: 0 0 32px;
    max-width: 34ch;
    color: var(--muted);
  }
  .notify {
    display: inline-block;
    background: var(--gold);
    color: var(--green-deep);
    font-weight: 600;
    font-size: 1rem;
    text-decoration: none;
    padding: 14px 26px;
    border-radius: 999px 999px 999px 4px;
    transition: transform .15s ease, background-color .15s ease;
  }
  .notify:hover { background: #F8CE72; transform: translateY(-2px); }
  .notify:focus-visible { outline: 3px solid var(--cream); outline-offset: 4px; }
  .fine { margin: 14px 0 0; font-size: .9rem; color: var(--muted); }
  [hidden] { display: none !important; }

  /* arches */
  .doors {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: clamp(10px, 2.4vw, 22px);
    width: 100%;
    max-width: 460px;
    justify-self: center;
  }
  .doors i {
    display: block;
    aspect-ratio: 132 / 190;
    border-radius: 50% 50% 0 0 / 34.7% 34.7% 0 0;
    background: rgba(244, 241, 228, .07);
    opacity: 0;
    transform: translateY(16px);
    animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay: calc(var(--i) * 55ms);
  }
  .doors i:nth-child(n+6)  { background: rgba(244, 241, 228, .12); }
  .doors i:nth-child(n+11) { background: rgba(244, 241, 228, .19); }
  .doors i.found {
    background: var(--gold);
    box-shadow: 0 0 0 clamp(6px, 1.2vw, 11px) var(--green),
                0 0 70px 12px rgba(244, 191, 75, .32);
    animation: rise .7s cubic-bezier(.2,.7,.2,1) 1.25s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* footer */
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    border-top: 1px solid var(--line);
    padding-top: 18px;
    color: var(--muted);
    font-size: .95rem;
  }
  .urdu {
    font-family: "Noto Nastaliq Urdu", "Noto Naskh Arabic", "Segoe UI", serif;
    font-size: 1.7rem;
    line-height: 1.9;
    color: var(--gold);
  }

  @media (prefers-reduced-motion: reduce) {
    .doors i, .doors i.found { animation: none; opacity: 1; transform: none; }
    .notify { transition: none; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="brand">
    <svg viewBox="600 330 420 340" role="img" aria-label="Daryaft logo">
      <path d="M625 654V481A135 135 0 0 1 895 481V654Z" fill="#F4F1E4"/>
      <path d="M717 654V535A139 139 0 0 1 995 535V654Z" fill="#03401B"/>
      <path d="M737 654V535A119 119 0 0 1 975 535V654Z" fill="#F4BF4B"/>
    </svg>
    <span>Daryaft</span>
  </header>

  <main>
    <section>
      <h1>Some things are waiting to be found.</h1>
      <p class="lede">Daryaft is on its way. We’ll let you know the moment it opens in Pakistan.</p>
      <a id="notify" class="notify" href="#" hidden>Notify me</a>
      <p class="fine" id="fine" hidden>We’ll only write when there’s news.</p>
    </section>

    <div class="doors" aria-hidden="true">
      <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i>
      <i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i class="found" style="--i:8"></i><i style="--i:9"></i>
      <i style="--i:10"></i><i style="--i:11"></i><i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i>
    </div>
  </main>

  <footer>
    <span class="urdu" lang="ur" dir="rtl">دریافت</span>
    <span>Coming soon in Pakistan</span>
  </footer>

</div>

<section class="newsletter">
    <h2>Stay Updated with Daryaft</h2>
    <p>Be the first to hear about our latest updates and announcements.</p>

    <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSfm30qplIoAfyyx3BVUD6tyDpqYeD-xMtZUeoDHsFK5bxQczQ/viewform?embedded=true"
        width="100%"
        height="450"
        frameborder="0"
        marginheight="0"
        marginwidth="0">
        Loading…
    </iframe>
</section>

<style>
.newsletter {
    max-width: 700px;
    margin: 60px auto;
    padding: 20px;
    text-align: center;
}

.newsletter iframe {
    width: 100%;
    border: none;
    border-radius: 8px;
}
</style>

<script>
  // Paste your waitlist form link between the quotes (Google Form, Tally, etc.).
  // Until you do, the "Notify me" button stays hidden.
  var WAITLIST_URL = "";

  if (WAITLIST_URL) {
    var btn = document.getElementById("notify");
    btn.href = WAITLIST_URL;
    btn.hidden = false;
    document.getElementById("fine").hidden = false;
  }
</script>
</body>
</html>
